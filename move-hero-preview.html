<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>EUFORIA MOVE 히어로 미리보기</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,700;0,800;1,800&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
  :root{
    --violet: #6C3CE9; --pink: #E6317B; --orange: #FF7A1A; --teal: #12C9AE;
    --navy: #14103D; --paper: #FFFFFF; --ink: #171235; --muted: #6E6A93; --line: #EAE7F7;
    --radius: 18px;
    --wash-violet: #EFEBFD; --wash-pink: #FDECF3; --wash-orange: #FFF2E6; --wash-teal: #E7F8F5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: repeating-linear-gradient(115deg, var(--wash-violet) 0 220px, var(--wash-pink) 220px 400px, var(--wash-orange) 400px 560px, var(--wash-teal) 560px 760px);
    background-attachment: fixed; color: var(--ink); font-family:'Work Sans', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  body::before{ content:''; position:fixed; inset:0; background-image: radial-gradient(rgba(20,16,61,0.055) 1.3px, transparent 1.3px); background-size:13px 13px; pointer-events:none; }
  a{ color:inherit; }
  .wrap{ position:relative; z-index:1; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; padding: 22px clamp(20px,4vw,56px) 14px; }
  .logo{ display:flex; align-items:center; gap:16px; text-decoration:none; }
  .logo .badge{ width:68px;height:68px;border-radius:16px; background:var(--navy); display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Kanit'; font-weight:800; font-style:italic; font-size:30px; border:3px solid #fff; box-shadow: 0 10px 22px -10px rgba(20,16,61,0.5); flex:0 0 auto; }
  .logo .name{ font-family:'Kanit'; font-weight:800; font-style:italic; font-size:32px; color:var(--navy); line-height:1; }
  .logo small{ display:block; font-family:'Work Sans'; font-weight:700; font-size:12.5px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-top:4px; }
  .logo-img{ height:76px; width:auto; display:block; flex:0 0 auto; }
  .footer-logo-img{ height:44px; width:auto; display:block; }
  .lang-switch{ display:flex; gap:4px; background:rgba(255,255,255,0.75); border:1.5px solid var(--line); border-radius:10px; padding:4px; backdrop-filter: blur(6px); }
  .lang-switch button{ all:unset; cursor:pointer; padding:7px 16px; border-radius:7px; font-size:13px; font-weight:800; color:var(--navy); transition: all .15s ease; }
  .lang-switch button.active{ background:var(--navy); color:#fff; }
  .nav-link{ all:unset; cursor:pointer; padding:9px 16px; border-radius:10px; font-size:13px; font-weight:800; color:var(--navy); border:1.5px solid var(--line); background:rgba(255,255,255,0.75); text-decoration:none; }
  .nav-link:hover{ border-color:var(--violet); color:var(--violet); }
  .nav-group{ display:flex; align-items:center; gap:10px; }
  .site-nav{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:14px clamp(20px,4vw,56px); border-top:1.5px solid var(--line); }
  .site-nav a{ text-decoration:none; font-size:13.5px; font-weight:800; color:var(--muted); padding:8px 14px; border-radius:999px; transition: all .15s ease; }
  .site-nav a:hover{ color:var(--violet); background:rgba(108,60,233,0.08); }
  .site-nav a.active{ color:#fff; background:var(--navy); }

  .page-hero{ padding:36px clamp(20px,4vw,56px) 8px; }
  .eyebrow{ display:inline-flex; align-items:center; gap:8px; color:#fff; background:var(--navy); font-size:12px; letter-spacing:1px; font-weight:800; margin-bottom:16px; padding:7px 16px; border-radius:999px; }
  .page-hero h1{ font-family:'Kanit'; font-weight:800; font-style:italic; font-size:clamp(30px,4vw,46px); line-height:1.15; margin:0 0 14px; color:var(--navy); }
  .page-hero h1 .hl{ color:#fff; background:var(--violet); padding:0 10px; }
  .page-hero p{ color:var(--muted); font-size:15.5px; line-height:1.75; max-width:640px; margin:0; font-weight:600; }

  .section{ padding:8px clamp(20px,4vw,56px) 24px; }
  .layout{ display:grid; grid-template-columns:1.5fr 1fr; gap:22px; max-width:1000px; margin:0 auto; }
  .section-inner{ background:var(--paper); border-radius:26px; padding:32px clamp(18px,3vw,36px); box-shadow:0 18px 44px -24px rgba(20,16,61,0.32); border:1.5px solid var(--line); }
  .section-inner h2{ font-family:'Kanit'; font-weight:800; font-style:italic; font-size:20px; margin:0 0 6px; color:var(--navy); }
  .section-inner .sub{ color:var(--muted); font-size:13px; font-weight:600; margin-bottom:22px; }

  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field.full{ grid-column:1/-1; }
  .field label{ font-size:12px; font-weight:800; color:var(--navy); }
  .field input, .field select, .field textarea{
    all:unset; border:2px solid var(--line); border-radius:10px; padding:11px 13px; font-size:13.5px;
    font-family:'Work Sans'; color:var(--ink); box-sizing:border-box; width:100%; background:#fff;
  }
  .field textarea{ min-height:110px; resize:vertical; line-height:1.6; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--violet); }

  .agree{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.6; margin:6px 0 20px; }
  .agree input{ margin-top:2px; accent-color:var(--violet); width:16px; height:16px; flex:0 0 auto; }

  .cta{ all:unset; display:block; width:100%; text-align:center; padding:15px; background:linear-gradient(90deg,var(--pink),var(--orange)); color:#fff; font-weight:800; border-radius:12px; cursor:pointer; font-size:14.5px; box-sizing:border-box; }
  .cta:hover{ filter:brightness(1.06); }

  .form-alert{ display:none; align-items:flex-start; gap:10px; background:#E7F9F5; border:2px solid #B7ECDE; border-radius:12px; padding:12px 16px; margin-bottom:18px; font-size:12.5px; font-weight:700; color:#0A6E5D; line-height:1.55; }
  .form-alert.show{ display:flex; }

  .side-card{ background:var(--navy); color:#fff; border-radius:var(--radius); padding:24px; margin-bottom:16px; }
  .side-card h3{ margin:0 0 8px; font-family:'Kanit'; font-weight:800; font-style:italic; font-size:16px; }
  .side-card p{ margin:0; font-size:12.5px; color:rgba(255,255,255,0.72); font-weight:600; line-height:1.7; }
  .side-list{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .side-list .row{ display:flex; justify-content:space-between; gap:10px; font-size:12.5px; border-bottom:1px solid rgba(255,255,255,0.14); padding-bottom:10px; }
  .side-list .row:last-child{ border-bottom:none; padding-bottom:0; }
  .side-list .k{ color:rgba(255,255,255,0.6); font-weight:700; }
  .side-list .v{ font-weight:800; color:var(--teal); text-align:right; }

  .side-card.light{ background:#fff; border:2px solid var(--line); color:var(--ink); }
  .side-card.light h3{ color:var(--navy); }
  .side-card.light p{ color:var(--muted); }

  footer{ padding:24px clamp(20px,4vw,56px) 40px; }
  .footer-inner{ display:grid; grid-template-columns:1.4fr 1fr auto; gap:32px; background:var(--paper); border:1.5px solid var(--line); border-radius:26px; padding:34px clamp(18px,3vw,40px); box-shadow:0 18px 44px -28px rgba(20,16,61,0.28); max-width:1120px; margin:0 auto; }
  .footer-col h6{ margin:0 0 14px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--navy); font-weight:800; }
  .footer-brand{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .footer-brand .badge{ width:36px;height:36px;border-radius:9px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Kanit'; font-weight:800; font-style:italic; font-size:16px; }
  .footer-brand .name{ font-family:'Kanit'; font-weight:800; font-style:italic; font-size:16px; color:var(--navy); }
  .footer-col p{ margin:0; font-size:12.5px; color:var(--muted); font-weight:600; line-height:1.7; max-width:320px; }
  .footer-links{ display:flex; flex-direction:column; gap:9px; }
  .footer-links a{ text-decoration:none; font-size:13px; font-weight:700; color:var(--ink); }
  .footer-links a:hover{ color:var(--violet); }
  .footer-links span{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .footer-bottom{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:20px clamp(4px,1vw,12px) 0; color:var(--muted); font-size:11.5px; font-weight:700; max-width:1000px; margin:0 auto; }
.footer-legal{ margin:12px 0 0; }
.footer-legal p{ display:flex; align-items:flex-start; gap:8px; margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:600; line-height:1.6; }
.footer-legal .ft-ico{ flex-shrink:0; font-size:14px; line-height:1.6; }
.footer-links span{ display:flex; align-items:flex-start; gap:8px; font-size:14px; color:var(--muted); font-weight:600; }
.footer-links .ft-ico{ flex-shrink:0; font-size:14px; }

  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } .field-grid{ grid-template-columns:1fr; } .footer-inner{ grid-template-columns:1fr; } }
/* ===== Mobile improvements (added) ===== */
  .nav-toggle{ display:none; }
  .nav-toggle-btn{ display:none; }
  @media (max-width: 780px){
    html,body{ overflow-x:hidden; }
    .nav-toggle-btn{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:10px; border:1.5px solid var(--line); background:rgba(255,255,255,0.75); cursor:pointer; font-size:20px; color:var(--navy); }
    .site-nav{ display:none; flex-direction:column; align-items:stretch; width:100%; }
    .nav-toggle:checked ~ .site-nav{ display:flex; }
    .site-nav a{ width:100%; box-sizing:border-box; }
    .hero-ctas{ flex-direction:column; align-items:stretch; }
    .hero-ctas .cta{ width:100%; }
    .promo-band, .cta-band{ flex-direction:column; align-items:flex-start; text-align:left; }
  }
  @media (max-width: 480px){
    .logo-img{ height:52px; }
    .logo .name{ font-size:22px; }
    .topbar{ gap:12px; padding:16px 16px 10px; }
    .site-nav{ padding:10px 16px; }
    .section{ padding:6px 16px 18px; }
    .section-inner{ padding:24px 16px; border-radius:18px; }
    .hero{ padding:20px 16px 20px; }
    footer{ padding:6px 16px 28px; }
    .footer-inner{ padding:22px 16px; border-radius:18px; }
  }

/* ===== 사이트 공유 (QR + 공유하기 버튼) ===== */
  .footer-share{ display:flex; flex-direction:column; align-items:flex-start; gap:12px; }
  .qr-box{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .qr-box img{ width:92px; height:92px; border-radius:10px; border:1.5px solid var(--line); padding:6px; background:#fff; display:block; }
  .qr-box .qr-caption{ font-size:11px; color:var(--muted); font-weight:600; }
  .share-btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:800; cursor:pointer; font-family:inherit; transition:background .15s,border-color .15s; }
  .share-btn:hover{ background:#F5F3FE; border-color:var(--violet); }
  .share-btn svg{ width:14px; height:14px; fill:var(--violet); flex-shrink:0; }

/* ===== 푸터 (4단 레이아웃) ===== */
  footer.euf-footer{ padding:24px clamp(20px,4vw,56px) 40px; background:none; border:0; }
  .euf-footer .ef-inner{ display:grid; grid-template-columns:1.25fr 1.15fr 1.15fr .85fr; gap:34px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:26px;
    padding:36px clamp(18px,3vw,40px) 30px; box-shadow:0 18px 44px -28px rgba(20,16,61,0.28);
    max-width:1180px; margin:0 auto; }
  .euf-footer .ef-col h6{ margin:0 0 16px; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--navy); font-weight:800; }
  .euf-footer .ef-logo{ height:34px; width:auto; display:block; margin-bottom:14px; }
  .euf-footer .ef-tag{ margin:0 0 18px; font-size:12.5px; line-height:1.75; font-weight:600; color:var(--muted); max-width:280px; }
  .euf-footer .ef-share{ all:unset; box-sizing:border-box; display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:800; cursor:pointer;
    border:1.5px solid var(--line); background:#fff; color:var(--ink); font-family:inherit;
    transition:background .15s,border-color .15s; }
  .euf-footer .ef-share:hover{ background:#F5F3FE; border-color:var(--violet); }
  .euf-footer .ef-share svg{ width:14px; height:14px; fill:var(--violet); flex-shrink:0; }
  .euf-footer .ef-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .euf-footer .ef-list li{ display:flex; gap:11px; align-items:flex-start; }
  .euf-footer .ef-list i{ flex:0 0 17px; height:17px; margin-top:1px; color:var(--violet); }
  .euf-footer .ef-list i svg{ width:17px; height:17px; display:block; }
  .euf-footer .ef-list b{ display:block; font-size:13.5px; font-weight:700; color:var(--ink); }
  .euf-footer .ef-list em{ display:block; font-style:normal; font-size:12px; font-weight:600;
    margin-top:2px; color:var(--muted); }
  .euf-footer .ef-list a{ text-decoration:none; }
  .euf-footer .ef-list a:hover b{ color:var(--violet); }
  .euf-footer .ef-hl{ font-weight:800 !important; color:var(--violet) !important; }
  .euf-footer .ef-qr{ display:flex; align-items:center; gap:13px; margin-top:20px; }
  .euf-footer .ef-qr img{ width:104px; height:104px; border-radius:10px; background:#fff;
    padding:7px; display:block; border:1.5px solid var(--line); }
  .euf-footer .ef-qr span{ font-size:11.5px; line-height:1.65; font-weight:600; color:var(--muted); }
  .euf-footer .ef-map{ display:flex; align-items:center; justify-content:center; gap:8px; height:118px;
    border-radius:14px; text-decoration:none; font-size:13px; font-weight:800;
    background:#F5F3FE; border:1.5px solid var(--line); color:var(--navy);
    transition:border-color .15s,color .15s; }
  .euf-footer .ef-map:hover{ border-color:var(--violet); color:var(--violet); }
  .euf-footer .ef-map svg{ width:17px; height:17px; }
  .euf-footer .ef-maplink{ display:inline-block; margin-top:11px; font-size:12px; font-weight:700;
    text-decoration:none; color:var(--muted); }
  .euf-footer .ef-maplink:hover{ color:var(--violet); }
  .euf-footer .ef-bottom{ display:flex; justify-content:space-between; gap:14px 24px; flex-wrap:wrap;
    align-items:center; max-width:1180px; margin:18px auto 0; padding:0 clamp(4px,1vw,12px); }
  .euf-footer .ef-legal, .euf-footer .ef-links{ display:flex; flex-wrap:wrap; gap:6px 14px;
    align-items:center; font-size:11.5px; font-weight:600; color:var(--muted); }
  .euf-footer .ef-legal span+span::before{ content:'·'; margin-right:14px; opacity:.55; }
  .euf-footer .ef-links a{ text-decoration:none; font-weight:700; color:var(--ink); }
  .euf-footer .ef-links a:hover{ color:var(--violet); }
  .euf-footer .ef-note{ max-width:1180px; margin:10px auto 0; padding:0 clamp(4px,1vw,12px);
    font-size:11.5px; font-weight:600; color:var(--muted); }
  @media (max-width:1040px){ .euf-footer .ef-inner{ grid-template-columns:1fr 1fr; gap:30px; } }
  @media (max-width:620px){ .euf-footer .ef-inner{ grid-template-columns:1fr; padding:26px 18px 24px; border-radius:18px; }
    .euf-footer .ef-bottom{ flex-direction:column; align-items:flex-start; }
    footer.euf-footer{ padding:6px 16px 28px; } }

/* ===== EUFORIA MOVE (교통 예약) ===== */
  .mv-hero{ background:linear-gradient(135deg, var(--navy) 0%, #2A1F6B 55%, var(--violet) 100%); min-height:352px;
    border-radius:26px; padding:38px clamp(20px,3.4vw,44px) 34px; color:#fff; position:relative; overflow:hidden;
    box-shadow:0 22px 50px -28px rgba(20,16,61,0.55); }
  .mv-hero::after{ content:''; position:absolute; right:-70px; top:-70px; width:280px; height:280px;
    border-radius:50%; background:radial-gradient(circle, rgba(18,201,174,0.35), transparent 68%); pointer-events:none; }
  .mv-hero .mv-tag{ display:inline-block; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,0.18);
    font-size:11px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; }
  .mv-hero h1{ font-family:'Kanit'; font-style:italic; font-weight:800; font-size:clamp(26px,3.4vw,38px);
    line-height:1.28; margin:16px 0 12px; max-width:640px; }
  .mv-hero h1 .hl{ color:var(--teal); }
  .mv-hero > p{ margin:0; font-size:14px; line-height:1.75; font-weight:600; opacity:.9; max-width:620px; }
  .mv-chips{ display:flex; flex-wrap:wrap; gap:9px; margin-top:22px; position:relative; z-index:1; }
  .mv-chips span{ padding:9px 16px; border-radius:999px; background:rgba(255,255,255,0.13);
    border:1.5px solid rgba(255,255,255,0.22); font-size:12.5px; font-weight:700; }

  .mv-step{ display:flex; align-items:center; gap:10px; margin:26px 0 14px;
    font-size:14.5px; font-weight:800; color:var(--navy); }
  .mv-step:first-of-type{ margin-top:4px; }
  .mv-num{ display:flex; align-items:center; justify-content:center; width:24px; height:24px; flex:0 0 24px;
    border-radius:50%; background:var(--violet); color:#fff; font-size:12px; font-weight:800; }

  .mv-types{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; }
  .mv-types label{ display:block; cursor:pointer; position:relative; }
  .mv-types input{ position:absolute; opacity:0; pointer-events:none; }
  .mv-types .box{ border:2px solid var(--line); border-radius:14px; padding:14px 16px; background:#fff;
    transition:border-color .15s, background .15s; height:100%; box-sizing:border-box; display:block; }
  .mv-types .box b{ display:block; font-size:13.5px; font-weight:800; color:var(--ink); }
  .mv-types .box em{ display:block; font-style:normal; font-size:11.5px; font-weight:600;
    color:var(--muted); margin-top:4px; line-height:1.55; }
  .mv-types input:checked + .box{ border-color:var(--violet); background:#F5F3FE; }
  .mv-types input:focus-visible + .box{ outline:2px solid var(--violet); outline-offset:2px; }

  .mv-hint{ font-size:11.5px; font-weight:700; color:var(--violet); margin-top:6px; }
  .mv-note{ font-size:12px; font-weight:600; color:var(--muted); line-height:1.7;
    background:#FAF9FE; border:1.5px solid var(--line); border-radius:12px; padding:13px 15px; margin:18px 0 6px; }

  .mv-sum .row .v{ color:#fff; }
  .mv-sum .row .v.on{ color:var(--teal); }
  .mv-cover{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .mv-cover span{ padding:5px 11px; border-radius:999px; background:#F5F3FE; border:1.5px solid var(--line);
    font-size:11.5px; font-weight:700; color:var(--navy); }
  @media (max-width:860px){ .mv-types{ grid-template-columns:1fr; } }

  .mv-soon{ display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px;
    background:#FFF2E6; border:1.5px solid #FFD3AC; color:#C2560A; font-size:11px; font-weight:800;
    letter-spacing:.02em; vertical-align:middle; }
  .mv-soon::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--orange); }
  .side-card:not(.light) .mv-soon{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.28); color:#fff; }
  .mv-fee h3{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .mv-sum .row .v.soon{ color:var(--orange); }

/* ----- 예약 조건 안내 ----- */
  .mv-cond{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin:2px 0 6px; }
  .mv-cond div{ border-radius:13px; padding:14px 15px; background:#FFF8F2; border:1.5px solid #FFE0C4; }
  .mv-cond b{ display:block; font-size:12.5px; font-weight:800; color:#B54708; }
  .mv-cond em{ display:block; font-style:normal; font-size:11.5px; font-weight:600; color:var(--muted);
    margin-top:5px; line-height:1.6; }

/* ----- 예약 확정 절차 ----- */
  .mv-flow{ display:grid; grid-template-columns:repeat(7,1fr); gap:0; margin-top:26px; position:relative; }
  .mv-flow .st{ position:relative; padding:0 9px; text-align:center; }
  .mv-flow .st::before{ content:''; position:absolute; top:17px; left:-50%; width:100%; height:2px;
    background:var(--line); z-index:0; }
  .mv-flow .st:first-child::before{ display:none; }
  .mv-flow .n{ position:relative; z-index:1; width:34px; height:34px; margin:0 auto 11px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:#fff; border:2px solid var(--line); color:var(--muted);
    font-size:13px; font-weight:800; }
  .mv-flow .st.key .n{ background:var(--violet); border-color:var(--violet); color:#fff; }
  .mv-flow .st.done .n{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .mv-flow b{ display:block; font-size:12.5px; font-weight:800; color:var(--ink); line-height:1.45; }
  .mv-flow em{ display:block; font-style:normal; font-size:11px; font-weight:600; color:var(--muted);
    margin-top:6px; line-height:1.6; }

  .mv-policy{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-top:28px; padding:18px 22px; border-radius:14px;
    background:#FAF9FE; border:1.5px solid var(--line); }
  .mv-policy p{ margin:0; font-size:12.5px; font-weight:600; color:var(--muted); line-height:1.7; }
  .mv-policy p b{ color:var(--navy); font-weight:800; }
  .mv-policy a{ flex:0 0 auto; padding:11px 20px; border-radius:999px; background:var(--navy); color:#fff;
    font-size:12.5px; font-weight:800; text-decoration:none; white-space:nowrap; }
  .mv-policy a:hover{ background:var(--violet); }

  .mv-link{ display:inline-block; margin-top:13px; font-size:12.5px; font-weight:800;
    color:var(--violet); text-decoration:none; }
  .mv-link:hover{ text-decoration:underline; }

  @media (max-width:980px){ .mv-flow{ grid-template-columns:repeat(4,1fr); row-gap:26px; }
    .mv-flow .st:nth-child(5)::before{ display:none; } }
  @media (max-width:700px){ .mv-cond{ grid-template-columns:1fr; }
    .mv-flow{ grid-template-columns:1fr; row-gap:0; }
    .mv-flow .st{ display:grid; grid-template-columns:34px 1fr; gap:14px; text-align:left;
      padding:0 0 20px; }
    .mv-flow .st::before{ display:none !important; }
    .mv-flow .st::after{ content:''; position:absolute; left:16px; top:34px; bottom:0; width:2px;
      background:var(--line); }
    .mv-flow .st:last-child::after{ display:none; }
    .mv-flow .n{ margin:0; }
    .mv-flow em{ margin-top:4px; }
    .mv-policy{ flex-direction:column; align-items:flex-start; } }

/* ----- 히어로 배경 지도 애니메이션 ----- */

  @media (max-width:1080px){ .mv-map{ width:36%; opacity:.85; } }
