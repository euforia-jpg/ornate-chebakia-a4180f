<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>예약 확인 — 유포리아투어</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!--
  손님 전용 예약 페이지 — https://toureplus.co.kr/my/<링크열쇠>
  _redirects 의 「/my/*  /my.html  200」 규칙으로 이 파일이 열립니다.
  내용은 netlify/functions/booking.js 가 링크열쇠를 확인한 뒤에만 돌려줍니다.
  메뉴 · 사이트맵 어디에도 걸지 않고, 검색엔진에도 올리지 않습니다(noindex).

  입금 기한 (2026-11): 대쉬보드에서 기한을 비워 두면
    예약금 30% → 이용일 7일 전 / 잔금 70% → 이용 당일 로 저절로 보여 줍니다.
-->
<style>
  :root{
    --ink:#1F2328; --muted:#77706A; --line:#E7E0D7; --paper:#FFFFFF; --bg:#F3EFE9;
    --coral:#D9575F; --coral-soft:#FBEDEB; --ok:#2F7D5B; --wait:#B4561D;
    /* 글꼴은 전부 맑은 고딕 (2026-11) — 맑은 고딕이 없는 아이폰 · 맥은 애플 고딕으로 보입니다 */
    --sans:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    --serif:var(--sans); --latin:var(--sans); --mono:var(--sans);
  }
  *{ box-sizing:border-box; }
  html{ font-synthesis:none; -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  .ic{ width:16px; height:16px; flex:0 0 16px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; }
  .wrap{ max-width:640px; margin:0 auto; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }

  /* ---------- 공통 본문 ---------- */
  .sec{ padding:22px 22px; }
  .sec h2{ display:flex; align-items:baseline; gap:10px; margin:0 0 14px; font-family:var(--serif); font-weight:700; font-size:17px; letter-spacing:-.2px; }
  .sec h2 i{ font-style:normal; font-family:var(--latin); font-size:15px; color:var(--coral); font-weight:600; letter-spacing:.5px; }
  .muted{ color:var(--muted); font-size:13.5px; }

  .track{ display:flex; gap:4px; margin:2px 0 8px; }
  .track span{ flex:1; height:3px; background:var(--line); border-radius:2px; }
  .track span.d{ background:var(--ink); } .track span.n{ background:var(--coral); }
  .tlb{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); }
  .tlb b{ color:var(--coral); font-weight:700; }
  .now{ margin-top:14px; padding:11px 14px; border-left:3px solid var(--coral); background:var(--coral-soft); font-size:14px; font-weight:600; }
  .now.ok{ border-color:var(--ok); background:#EEF5F1; }

  .meta{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
  .meta div{ padding:11px 0; border-bottom:1px solid var(--line); }
  .meta div:nth-child(odd){ padding-right:12px; } .meta div:nth-child(even){ padding-left:12px; border-left:1px solid var(--line); }
  .meta small{ display:block; font-size:11px; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; }
  .meta b{ font-weight:600; font-size:14.5px; }
  .meta .full{ grid-column:1/-1; padding-left:0 !important; border-left:none !important; }

  .day{ display:grid; grid-template-columns:58px 1fr; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
  .day:first-child{ border-top:none; padding-top:2px; }
  .dd{ font-family:var(--latin); line-height:1.1; }
  .dd b{ display:block; font-size:21px; font-weight:700; }
  .dd small{ font-family:var(--sans); font-size:11px; color:var(--muted); letter-spacing:.3px; }
  .dt{ font-weight:700; font-size:15px; }
  .dt em{ font-style:normal; font-weight:500; color:var(--muted); font-size:12px; margin-right:6px; }
  .dx{ color:#4c4741; font-size:14px; white-space:pre-line; }
  .meet{ display:flex; gap:8px; margin-top:8px; padding:9px 11px; background:#F7F4EF; border-radius:6px; font-size:13.5px; white-space:pre-line; }
  .meet a{ color:var(--coral); font-weight:700; text-decoration:none; }
  .more{ all:unset; cursor:pointer; margin-top:6px; font-size:13.5px; font-weight:700; color:var(--coral); }

  .pay{ display:flex; justify-content:space-between; gap:12px; padding:13px 0; border-top:1px solid var(--line); }
  .pay:first-child{ border-top:none; padding-top:2px; }
  .pay .l b{ display:block; font-weight:600; }
  .pay .l small{ color:var(--muted); font-size:12.5px; }
  .pay .r{ text-align:right; white-space:nowrap; }
  .amt{ font-family:var(--latin); font-size:18px; font-weight:700; line-height:1.3; }
  .krw{ display:block; font-size:12px; color:var(--muted); } .krw:empty{ display:none; }
  .st{ display:inline-block; margin-top:3px; font-size:12px; font-weight:700; }
  .st.ok{ color:var(--ok); } .st.no{ color:var(--wait); }
  .rate{ font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.6; } .rate:empty{ display:none; }
  .acct{ margin-top:16px; border:1px solid var(--line); border-radius:8px; padding:4px 14px; background:#FCFAF7; }
  .acct-h{ font-size:11.5px; font-weight:700; color:var(--muted); margin:12px 0 0; letter-spacing:.2px; }
  .acc{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .acc:last-child{ border-bottom:none; }
  .acc .n{ font-size:12.5px; color:var(--muted); }
  .acc .v{ font-family:var(--mono); font-size:14px; letter-spacing:0; font-weight:600; word-break:break-all; }
  .acc .o{ font-size:11.5px; color:var(--muted); }
  .cp{ all:unset; cursor:pointer; font-size:12px; font-weight:700; color:var(--ink); border:1px solid var(--ink); border-radius:999px; padding:4px 11px; white-space:nowrap; }
  .small{ font-size:12.5px; color:var(--muted); margin-top:10px; }

  .doc{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); font-size:14px; }
  .doc:first-child{ border-top:none; padding-top:2px; }
  .doc span{ display:flex; gap:8px; align-items:center; }
  .doc a{ color:var(--coral); font-weight:700; text-decoration:none; white-space:nowrap; }
  .doc s{ color:#A39B93; text-decoration:none; font-size:12.5px; white-space:nowrap; }

  .kk{ display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border:1px solid #EADFA6; background:#FFFBE6; border-radius:8px; font-size:13.5px; margin-bottom:12px; }
  .kk a{ font-weight:700; }
  .msgs{ max-height:420px; overflow-y:auto; margin-bottom:10px; }
  .msg{ padding:9px 12px; margin-bottom:7px; font-size:14px; white-space:pre-wrap; word-break:break-word; border-radius:10px; }
  .msg.g{ background:#F2EEE8; margin-left:28px; } .msg.o{ background:#fff; border:1px solid var(--line); margin-right:28px; }
  .msg small{ display:block; color:var(--muted); font-size:11px; margin-bottom:2px; }
  .in{ display:flex; gap:8px; align-items:flex-end; }
  .in textarea{ flex:1; border:1px solid #D9D0C5; border-radius:8px; padding:10px 12px; font:inherit; font-size:14px; min-height:46px; max-height:160px; resize:vertical; outline:none; background:#fff; }
  .in textarea:focus{ border-color:var(--ink); }
  .in button{ all:unset; cursor:pointer; background:var(--ink); color:#fff; border-radius:8px; padding:12px 16px; font-weight:700; font-size:14px; }
  .in button[disabled]{ opacity:.5; cursor:default; }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }

  .contact a{ display:flex; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line); text-decoration:none; }
  .contact a:first-child{ border-top:none; }
  .contact .t{ flex:1; } .contact .t b{ display:block; font-weight:700; font-size:14.5px; } .contact .t small{ color:var(--muted); font-size:12.5px; }
  .contact .go{ color:var(--muted); }
  .badge{ display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700; color:#5A4A00; background:#FEE500; border-radius:999px; padding:1px 7px; vertical-align:2px; }
  .sign{ text-align:center; padding:26px 20px 6px; font-size:11.5px; color:var(--muted); line-height:1.8; }
  .sign img{ height:34px; width:auto; margin-bottom:6px; }
  .sign .f{ font-family:var(--latin); font-size:15px; color:var(--ink); letter-spacing:.3px; }
  .msgbox{ max-width:440px; margin:70px auto; background:#fff; border:1px solid var(--line); border-radius:10px; padding:26px 22px; text-align:center; }
  .msgbox h1{ font-family:var(--serif); font-size:19px; margin:0 0 8px; }
  .msgbox p{ color:var(--muted); font-size:14px; margin:0 0 14px; }
  .spin{ width:26px; height:26px; border:2px solid var(--line); border-top-color:var(--coral); border-radius:50%; margin:90px auto 12px; animation:sp .9s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* 손님 전용 안내 박스 (2026-11) */
  .only{ display:flex; gap:12px; align-items:flex-start; margin:0 0 18px; padding:14px 16px; background:var(--coral-soft); border:1px solid #F1CFCB; border-radius:8px; }
  .only .k{ flex:0 0 34px; height:34px; border-radius:50%; background:#fff; color:var(--coral); display:flex; align-items:center; justify-content:center; }
  .only .k .ic{ width:18px; height:18px; flex-basis:18px; vertical-align:0; }
  .only b{ display:block; font-size:15px; font-weight:700; color:var(--ink); margin-bottom:3px; }
  .only p{ margin:0; font-size:13.5px; line-height:1.65; color:#5b4f49; }

  /* 기사 · 차량 (2026-11) */
  .car{ padding:14px 0; border-top:1px solid var(--line); }
  .car:first-child{ border-top:none; padding-top:2px; }
  .car .w{ font-size:12px; font-weight:700; color:var(--coral); margin-bottom:6px; }
  .car .p{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .car .p b{ font-size:16px; font-weight:700; }
  .car .p small{ display:block; color:var(--muted); font-size:13px; }
  .car .bt{ display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .car .bt a{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; text-decoration:none; border:1px solid var(--ink); border-radius:999px; padding:5px 11px; white-space:nowrap; justify-content:center; }
  .car .bt a.wa{ border-color:#1F9D55; color:#1F7A44; }
  .car .v{ display:flex; gap:10px; align-items:center; margin-top:10px; padding:10px 12px; background:#F7F4EF; border-radius:6px; font-size:14px; }
  .car .pl{ display:inline-block; border:1.5px solid var(--ink); border-radius:4px; padding:0 7px; font-weight:700; letter-spacing:1px; font-size:13.5px; background:#fff; white-space:nowrap; }
  .car .nt{ margin-top:8px; font-size:13.5px; color:#4c4741; white-space:pre-line; }

  /* ====================== 예약 확정서 모양 (2026-11 확정) ====================== */
  .th-a .sheet{ background:var(--paper); margin:14px 12px; border-radius:4px; box-shadow:0 1px 0 #E2D9CE, 0 18px 40px -30px rgba(60,40,20,.35); }
  .th-a .hd{ padding:22px 22px 20px; border-bottom:1px solid var(--line); position:relative; }
  .th-a .hd::before{ content:''; position:absolute; left:0; right:0; top:0; height:4px; background:var(--coral); border-radius:4px 4px 0 0; }
  .th-a .hd-top{ display:flex; justify-content:space-between; align-items:center; }
  .th-a .lg{ height:42px; width:auto; }
  .th-a .doc-t{ text-align:right; font-family:var(--latin); font-size:11px; letter-spacing:1.5px; color:var(--muted); line-height:1.3; }
  .th-a .doc-t b{ display:block; font-family:var(--serif); letter-spacing:0; font-size:13px; color:var(--ink); }
  .th-a h1{ font-family:var(--serif); font-weight:700; font-size:20px; letter-spacing:-.3px; margin:20px 0 4px; }
  .th-a h1 span{ color:var(--coral); }
  .th-a .sub{ color:var(--muted); font-size:14px; margin:0 0 16px; }
  .th-a .sec + .sec{ border-top:1px solid var(--line); }
  .th-a .code-v{ font-family:var(--mono); font-weight:600; letter-spacing:.8px; }

</style>
</head>

<div class="wrap" id="app"><div class="spin"></div><p class="muted" style="text-align:center">예약을 불러오는 중입니다…</p></div>
