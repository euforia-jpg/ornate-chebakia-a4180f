<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>내 예약 — 유포리아투어</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 한글 글꼴 Pretendard (다른 쪽과 같은 연결) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  손님 전용 예약 페이지 — https://toureplus.co.kr/my/<링크열쇠>
  _redirects 의 「/my/*  /my.html  200」 규칙으로 이 파일이 열립니다.
  내용은 netlify/functions/booking.js 가 링크열쇠를 확인한 뒤에만 돌려줍니다.
  메뉴 · 사이트맵 어디에도 걸지 않고, 검색엔진에도 올리지 않습니다(noindex).
-->
<style>
  :root{ --navy:#24303A; --ink:#1d2730; --muted:#6b7680; --line:#e6e9ee; --bg:#f4f6f9;
         --teal:#12a892; --violet:#5b3bd6; --orange:#e2700f; --red:#c8324f; }
  *{ box-sizing:border-box; }
  html{ font-synthesis:none; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.6;
        font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
        -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  .wrap{ max-width:620px; margin:0 auto; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  .hd{ background:var(--navy); color:#fff; padding:20px 20px 24px; }
  .logo{ font-weight:800; font-style:italic; font-size:18px; letter-spacing:-.2px; }
  .logo span{ font-style:normal; font-weight:700; font-size:11px; opacity:.6; margin-left:7px; }
  .hd h1{ font-size:22px; margin:16px 0 4px; line-height:1.35; }
  .hd .c{ opacity:.75; font-size:13px; }
  .box{ background:#fff; border:1px solid var(--line); border-radius:16px; margin:12px 14px; padding:16px 17px; }
  .box h2{ font-size:15.5px; margin:0 0 11px; color:var(--navy); }
  .steps{ display:flex; align-items:center; margin:4px 2px 2px; }
  .steps i{ flex:1; height:4px; background:var(--line); }
  .steps i.d{ background:var(--teal); }
  .steps b{ width:24px; height:24px; border-radius:50%; background:var(--line); color:#fff; font-size:11.5px;
            display:flex; align-items:center; justify-content:center; flex:0 0 24px; }
  .steps b.d{ background:var(--teal); } .steps b.n{ background:var(--orange); }
  .lb{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px; }
  .lb span{ width:52px; text-align:center; } .lb span:first-child{ text-align:left; } .lb span:last-child{ text-align:right; }
  .now{ margin-top:12px; background:#fff6ec; color:#9a4a00; border-radius:10px; padding:10px 12px; font-weight:700; font-size:14px; }
  .now.ok{ background:#eaf8f4; color:#0b7a68; }
  .kv{ display:grid; grid-template-columns:72px 1fr; row-gap:8px; font-size:14px; }
  .kv span{ color:var(--muted); }
  .day{ border-left:3px solid var(--teal); padding:2px 0 10px 12px; margin-bottom:6px; }
  .day b{ display:block; font-size:14.5px; }
  .day .d{ color:var(--muted); font-size:13.5px; white-space:pre-line; }
  .meet{ background:#eefaf7; border-radius:10px; padding:10px 12px; font-size:13.5px; margin-top:7px; white-space:pre-line; }
  .meet a{ color:#0b7a68; font-weight:800; text-decoration:none; display:inline-block; margin-top:4px; }
  .more{ all:unset; cursor:pointer; color:var(--violet); font-weight:800; font-size:13.5px; }
  .pay{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .pay:last-of-type{ border-bottom:none; }
  .pay em{ display:block; font-style:normal; color:var(--muted); font-size:12.5px; }
  .pay .r{ text-align:right; white-space:nowrap; }
  .ok{ color:var(--teal); font-weight:800; } .no{ color:var(--orange); font-weight:800; }
  .small{ font-size:12.5px; color:var(--muted); margin-top:8px; }
  .doc{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .doc:last-child{ border-bottom:none; }
  .doc a{ color:var(--violet); font-weight:800; text-decoration:none; white-space:nowrap; }
  .doc s{ color:#9aa3ab; text-decoration:none; font-size:12.5px; white-space:nowrap; }
  .msgs{ max-height:420px; overflow-y:auto; margin-bottom:8px; }
  .msg{ border-radius:12px; padding:9px 12px; margin-bottom:7px; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .msg.g{ background:#f1eeff; margin-left:24px; } .msg.o{ background:#eefaf7; margin-right:24px; }
  .msg small{ display:block; color:var(--muted); font-size:11px; margin-bottom:2px; }
  .in{ display:flex; gap:7px; align-items:flex-end; }
  .in textarea{ flex:1; border:1.5px solid var(--line); border-radius:11px; padding:10px 11px; font:inherit; font-size:14px;
                min-height:46px; max-height:160px; resize:vertical; outline:none; }
  .in textarea:focus{ border-color:var(--violet); }
  .in button{ all:unset; cursor:pointer; background:var(--violet); color:#fff; border-radius:11px; padding:12px 15px; font-weight:800; font-size:14px; }
  .in button[disabled]{ opacity:.5; cursor:default; }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }
  .sos{ background:var(--navy); color:#fff; border-radius:16px; margin:12px 14px 6px; padding:15px 17px; font-size:14px; line-height:1.8; }
  .sos b{ display:block; }
  .sos a{ color:#fff; font-weight:800; }
  .ft{ text-align:center; font-size:11.5px; color:var(--muted); padding:14px 20px 4px; line-height:1.7; }
  .msgbox{ max-width:440px; margin:70px auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px 22px; text-align:center; }
  .msgbox h1{ font-size:18px; margin:0 0 8px; }
  .msgbox p{ color:var(--muted); font-size:14px; margin:0 0 14px; }
  .spin{ width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--violet); border-radius:50%;
         margin:90px auto 12px; animation:sp 0.9s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .muted{ color:var(--muted); font-size:13.5px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div><p class="muted" style="text-align:center">예약을 불러오는 중입니다…</p></div>

<script>
(function(){
  'use strict';
  var API = '/.netlify/functions/booking';
  var 열쇠 = (location.pathname.match(/\/my\/([A-Za-z0-9_-]{20,40})/) || [])[1] ||
             new URLSearchParams(location.search).get('t') || '';
  var 자료 = null, 연락 = null, 다보기 = false;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var 요일 = ['일','월','화','수','목','금','토'];
  function 날(s, 요일붙임){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return '';
    var d = new Date(s + 'T12:00:00');
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일' + (요일붙임 ? '(' + 요일[d.getDay()] + ')' : '');
  }
  function 짧은날(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return ''; var p = s.split('-'); return (+p[1]) + '/' + (+p[2]); }
  function 돈(p){
    if(!p.amount) return '';
    return p.cur === 'KRW' ? Number(p.amount).toLocaleString('ko-KR') + '원'
                           : '€ ' + Number(p.amount).toLocaleString('de-DE', { minimumFractionDigits: p.amount % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function 시각(iso){
    try {
      var d = new Date(iso), t = new Date();
      var hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      return d.toDateString() === t.toDateString() ? '오늘 ' + hm : (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm;
    } catch(e){ return ''; }
  }
  function 막힘(제목, 말){
    document.getElementById('app').innerHTML =
      '<div class="msgbox"><h1>' + esc(제목) + '</h1><p>' + esc(말) + '</p>' +
      '<p class="muted">문의 · 카카오톡 <b>losnuevos</b><br>+34 611 209 095 · euforia@euforiatour.com</p></div>';
  }

  function 안내줄(b){
    if(b.notice) return { t: b.notice, ok: false };
    var 남은 = (b.pay || []).filter(function(p){ return !p.paid; });
    if(남은.length){
      var p = 남은[0];
      return { t: (p.label || '결제') + (p.amount ? ' ' + 돈(p) : '') + '을(를) ' + (p.due ? 날(p.due) + '까지 ' : '') + '입금해 주세요.', ok: false };
    }
    var 말 = ['문의를 확인하고 있습니다. 곧 담당자가 안내해 드립니다.', '예약이 확정되었습니다.', '결제가 모두 확인되었습니다.',
              '출발 준비가 끝났습니다. 즐거운 여행 되세요!', '즐거운 여행 되세요! 급한 일은 아래 연락처로 연락 주세요.', '함께해 주셔서 감사합니다.'];
    if((b.pay || []).length && b.status <= 2) return { t: '결제가 모두 확인되었습니다. 감사합니다.', ok: true };
    return { t: 말[b.status] || '', ok: true };
  }

  function 그리기(){
    var b = 자료, h = [];
    var 기간 = b.start ? 날(b.start, true) + (b.end && b.end !== b.start ? ' ~ ' + 날(b.end, true) : '') : '';

    h.push('<div class="hd"><div class="logo">Euforia Tour<span>내 예약</span></div>' +
           '<h1>' + esc(b.surname) + ' 님의 여행</h1>' +
           '<div class="c">예약코드 ' + esc(b.code) + (b.people ? ' · ' + esc(b.people) : '') + '</div></div>');

    /* 진행 상황 — 마지막 「종료」 단계는 점으로 그리지 않습니다 */
    var 보일 = b.단계.slice(0, 5), s = '', l = '';
    보일.forEach(function(n, i){
      var 끝남 = i < b.status || b.status >= 5, 지금 = i === b.status && b.status < 5;
      s += (i ? '<i class="' + (i <= b.status ? 'd' : '') + '"></i>' : '') +
           '<b class="' + (끝남 ? 'd' : 지금 ? 'n' : '') + '">' + (끝남 ? '✓' : (i + 1)) + '</b>';
      l += '<span>' + esc(n) + '</span>';
    });
    var 안 = 안내줄(b);
    h.push('<div class="box"><h2>진행 상황</h2><div class="steps">' + s + '</div><div class="lb">' + l + '</div>' +
           (안.t ? '<div class="now' + (안.ok ? ' ok' : '') + '">' + esc(안.t) + '</div>' : '') + '</div>');

    h.push('<div class="box"><h2>여행 개요</h2><div class="kv">' +
           (b.product ? '<span>상품</span><b>' + (b.productUrl ? '<a href="' + esc(b.productUrl) + '" target="_blank" rel="noopener">' + esc(b.product) + '</a>' : esc(b.product)) + '</b>' : '') +
           (기간 ? '<span>날짜</span><div>' + esc(기간) + '</div>' : '') +
           (b.people ? '<span>인원</span><div>' + esc(b.people) + '</div>' : '') +
           '<span>담당</span><div>유포리아투어 마드리드 사무실</div></div></div>');

    if((b.days || []).length){
      var 줄 = b.days, 보기 = 다보기 ? 줄 : 줄.slice(0, 3);
      h.push('<div class="box"><h2>일자별 일정</h2>' + 보기.map(function(d, i){
        var idx = 줄.indexOf(d) + 1;
        return '<div class="day"><b>' + idx + '일' + (d.date ? ' · ' + 짧은날(d.date) : '') + (d.title ? ' ' + esc(d.title) : '') + '</b>' +
          (d.desc ? '<div class="d">' + esc(d.desc) + '</div>' : '') +
          (d.meet || d.map ? '<div class="meet">' + (d.meet ? '🚐 ' + esc(d.meet) : '') +
             (d.map ? (d.meet ? '<br>' : '') + '<a href="' + esc(d.map) + '" target="_blank" rel="noopener">지도 열기 ↗</a>' : '') + '</div>' : '') +
          '</div>';
      }).join('') + (줄.length > 3 ? '<button class="more" id="more">' + (다보기 ? '접기 ▴' : '일정 전체 보기 (' + 줄.length + '일) ▾') + '</button>' : '') + '</div>');
    }

    if((b.pay || []).length){
      h.push('<div class="box"><h2>결제</h2>' + b.pay.map(function(p){
        return '<div class="pay"><div>' + esc(p.label || '결제') + (p.due ? '<em>' + 날(p.due) + '까지</em>' : '') + '</div>' +
               '<div class="r">' + (돈(p) ? '<div>' + 돈(p) + '</div>' : '') +
               (p.paid ? '<span class="ok">입금 확인 ✓</span>' : '<span class="no">입금 대기</span>') + '</div></div>';
      }).join('') + '<div class="small">입금 계좌는 담당자가 보내 드린 안내 메일을 확인해 주세요. 입금하신 뒤 아래 메시지로 알려 주시면 빨리 확인해 드립니다.</div></div>');
    }

    if((b.docs || []).length){
      h.push('<div class="box"><h2>서류</h2>' + b.docs.map(function(d){
        return '<div class="doc"><span>📄 ' + esc(d.name) + '</span>' +
          (d.open ? '<a href="' + API + '?action=file&t=' + encodeURIComponent(열쇠) + '&id=' + encodeURIComponent(d.id) + '">내려받기</a>'
                  : '<s>' + esc(d.why || '준비 중') + '</s>') + '</div>';
      }).join('') + '</div>');
    }

    h.push('<div class="box"><h2>담당자에게 메시지</h2><div class="msgs" id="msgs">' +
      ((b.msgs || []).length ? b.msgs.map(function(m){
        return '<div class="msg ' + (m.from === 'guest' ? 'g' : 'o') + '"><small>' + (m.from === 'guest' ? '나' : '유포리아투어') + ' · ' + 시각(m.at) + '</small>' + esc(m.text) + '</div>';
      }).join('') : '<p class="muted" style="margin:0 0 6px">일정 변경 · 항공편 · 미팅 장소 등 궁금한 점을 남겨 주세요.</p>') +
      '</div><div class="in"><textarea id="txt" maxlength="1000" placeholder="질문이나 변경 요청을 남겨 주세요"></textarea><button id="send">보내기</button></div>' +
      '<div class="hint" id="hint">답장은 이 페이지에 올라옵니다. 급한 일은 아래 전화 · 카카오톡을 이용해 주세요.</div></div>');

    var c = 연락 || {};
    h.push('<div class="sos"><b>여행 중 급한 일이 생기면</b>📞 <a href="tel:' + esc(String(c.phone || '').replace(/\s/g,'')) + '">' + esc(c.phone || '') + '</a> (현지)<br>💬 카카오톡 채널 <b style="display:inline">' + esc(c.kakao || '') + '</b><br>✉️ ' + esc(c.email || '') + '</div>');
    h.push('<div class="ft">이 페이지는 예약하신 분만 보실 수 있도록 만든 전용 링크입니다.<br>다른 분께 링크를 전달하지 말아 주세요.<br>Euforia Das Nuvens S.L · CICMA No.4443 · Madrid</div>');

    document.getElementById('app').innerHTML = h.join('');
    var 메 = document.getElementById('msgs'); if(메) 메.scrollTop = 메.scrollHeight;
    var mo = document.getElementById('more');
    if(mo) mo.onclick = function(){ 다보기 = !다보기; 그리기(); };
    document.getElementById('send').onclick = 보내기;
  }

  function 보내기(){
    var ta = document.getElementById('txt'), bt = document.getElementById('send'), hint = document.getElementById('hint');
    var text = ta.value.trim();
    if(!text){ ta.focus(); return; }
    bt.disabled = true; bt.textContent = '보내는 중';
    fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'msg', t:열쇠, text:text }) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || '보내지 못했습니다'); return j; }); })
      .then(function(j){ 자료.msgs = j.msgs || 자료.msgs; 그리기(); document.getElementById('hint').textContent = '보냈습니다. 담당자가 확인 후 이곳에 답장을 드립니다.'; })
      .catch(function(e){ bt.disabled = false; bt.textContent = '보내기'; hint.textContent = e.message; hint.style.color = 'var(--red)'; });
  }

  function 불러오기(){
    if(!열쇠){ 막힘('예약을 찾을 수 없습니다', '받으신 링크를 그대로 눌러 주세요.'); return; }
    fetch(API + '?action=view&t=' + encodeURIComponent(열쇠), { cache:'no-store' })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
      .then(function(x){
        if(!x.ok){ 막힘(x.j && x.j.error && /닫/.test(x.j.error) ? '예약 페이지가 닫혀 있습니다' : '예약을 찾을 수 없습니다', (x.j && x.j.error) || ''); return; }
        자료 = x.j.booking; 연락 = x.j.contact;
        document.title = 자료.surname + ' 님의 예약 — 유포리아투어';
        그리기();
      })
      .catch(function(){ 막힘('잠시 연결이 원활하지 않습니다', '잠시 뒤 다시 열어 주세요.'); });
  }

  불러오기();
  /* 답장을 기다리는 손님을 위해 화면을 다시 볼 때 새로 불러옵니다 (쓰는 중이면 건너뜀) */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden || !자료) return;
    var ta = document.getElementById('txt');
    if(ta && ta.value.trim()) return;
    불러오기();
  });
})();
</script>
</body>
</html>
