# 예약(자동) 실행 설정 — 시간은 모두 UTC 기준입니다

# 라리가 경기 일정을 주 1회 받아 옵니다 (원래 있던 설정, 건드리지 않았습니다)
[functions."update-matches"]
  schedule = "@weekly"

# 공연 일정을 주 1회 받아 옵니다
# 제미나이가 구글 검색으로 정해둔 공연장의 다음 일정을 모아
# data/concerts.json 에 저장합니다. 요금은 올리지 않습니다.
[functions."update-concerts"]
  schedule = "@weekly"

# 쓰레드 요일별 자동 광고
# 매시 정각에 깨어나되, 실제로 올릴지는 대쉬보드에서 정한
# 요일·시각(스페인 현지)을 함수가 직접 따져서 결정합니다.
# 그래서 요일이나 시각을 바꿔도 이 파일을 고칠 필요가 없습니다.
[functions."threads-cron"]
  schedule = "0 * * * *"

# 카카오톡 알림 토큰이 60일 만에 끊기지 않게 매일 한 번 확인합니다
# 확인하면서 카카오가 새 토큰을 주면 저장소에 자동으로 갈아 끼웁니다.
# 메시지는 보내지 않습니다.
[functions."kakao-keepalive"]
  schedule = "@daily"
